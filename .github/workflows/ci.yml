name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  windows:
    name: Windows checks
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: node scripts/release/version.mjs
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: pnpm audit --prod --audit-level high
  dependencies:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
  linux:
    name: Linux CLI checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal --component clippy
      - run: rustup override set 1.99.1
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --no-default-features --features cli --all-targets
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --no-default-features --features cli
      - run: cargo build --manifest-path src-tauri/Cargo.toml --locked --no-default-features --features cli --bin codedoctor-cli
      - run: node scripts/validation/cli-smoke.mjs src-tauri/target/debug/codedoctor-cli
