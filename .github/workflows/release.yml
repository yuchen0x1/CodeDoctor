name: Build and release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          node scripts/release/version.mjs
  windows:
    name: Package Windows x64
    needs: [verify, source]
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check tag version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release/version.mjs
      - run: ./scripts/release/package-windows.ps1 -Destination release-staging
      - run: node scripts/release/licenses.mjs release-staging/THIRD-PARTY-NOTICES-Windows.txt x86_64-pc-windows-msvc desktop
      - name: Check packaged window can open
        shell: pwsh
        run: |
          $process = Start-Process (Join-Path $PWD 'release-staging/codedoctor.exe') -PassThru
          try {
            for ($i = 0; $i -lt 60; $i++) {
              $process.Refresh()
              if ($process.HasExited) { throw "CodeDoctor exited during launch ($($process.ExitCode))" }
              if ($process.MainWindowTitle -eq 'CodeDoctor') { return }
              Start-Sleep -Milliseconds 500
            }
            throw 'CodeDoctor window did not appear'
          } finally {
            if (!$process.HasExited) { $process.Kill() }
          }
      - run: ./scripts/validation/installer-smoke.ps1 -Folder release-staging
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-x64
          path: release-staging/
          if-no-files-found: error
  linux:
    name: Package Linux x64 CLI
    needs: [verify, source]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal --target x86_64-unknown-linux-musl
      - run: rustup override set 1.99.1
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build and exercise static CLI
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --locked --release --no-default-features --features cli --bin codedoctor-cli --target x86_64-unknown-linux-musl
          binary=src-tauri/target/x86_64-unknown-linux-musl/release/codedoctor-cli
          node scripts/validation/cli-smoke.mjs "$binary"
          if readelf -l "$binary" | grep -q INTERP; then echo 'CLI must be static'; exit 1; fi
          version=$(node scripts/release/version.mjs)
          mkdir -p release-staging cli-package
          install -m 755 "$binary" cli-package/codedoctor-cli
          cp LICENSE cli-package/
          node scripts/release/licenses.mjs cli-package/THIRD-PARTY-NOTICES.txt x86_64-unknown-linux-musl cli
          tar -C cli-package -czf "release-staging/CodeDoctor_${version}_linux_x64-cli.tar.gz" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-cli-x64
          path: release-staging/
          if-no-files-found: error
  sign:
    name: Sign Windows update packages
    needs: windows
    if: github.event_name == 'push' && github.ref_type == 'tag'
    environment: release-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-x64
          path: release-staging
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
      - name: Sign and independently verify installer signatures
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(node scripts/release/version.mjs)
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          node -p 'require("./src-tauri/tauri.conf.json").plugins.updater.pubkey' | base64 -d > "$RUNNER_TEMP/updater.pub"
          for package in "release-staging/CodeDoctor_${version}_x64-setup.exe" "release-staging/CodeDoctor_${version}_x64_en-US.msi"; do
            pnpm exec tauri signer sign --app-version "$version" "$package"
            base64 -d "$package.sig" > "$RUNNER_TEMP/package.minisig"
            minisign -Vm "$package" -p "$RUNNER_TEMP/updater.pub" -x "$RUNNER_TEMP/package.minisig"
          done
          node scripts/release/update-manifest.mjs release-staging "$version"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signed-windows-x64
          path: release-staging/
          if-no-files-found: error
  publish:
    needs: [sign, linux]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify tagged commit belongs to main
        run: git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: signed-windows-x64
          path: release-staging
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: linux-cli-x64
          path: release-staging
      - name: Generate checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release/assets.mjs release-staging "$(node scripts/release/version.mjs)"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-staging/*
      - name: Generate and verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(node scripts/release/version.mjs)
          node scripts/release/publish.mjs release-staging "$version"
