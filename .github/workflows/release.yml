name: Build and release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  windows:
    name: Package Windows x64
    needs: verify
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check tag version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release/version.mjs
      - run: ./scripts/release/package-windows.ps1 -Destination release-staging
      - name: Check packaged window can open
        shell: pwsh
        run: |
          $process = Start-Process (Join-Path $PWD 'release-staging/codedoctor.exe') -PassThru
          try {
            for ($i = 0; $i -lt 60; $i++) {
              $process.Refresh()
              if ($process.HasExited) { throw "CodeDoctor exited during launch ($($process.ExitCode))" }
              if ($process.MainWindowTitle -eq 'CodeDoctor') { return }
              Start-Sleep -Milliseconds 500
            }
            throw 'CodeDoctor window did not appear'
          } finally {
            if (!$process.HasExited) { $process.Kill() }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-x64
          path: release-staging/
          if-no-files-found: error
  publish:
    needs: windows
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify tagged commit belongs to main
        run: git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-x64
          path: release-staging
      - name: Generate and verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(node scripts/release/version.mjs)
          node scripts/release/assets.mjs release-staging "$version"
          node scripts/release/publish.mjs release-staging "$version"
