name: Set up CodeDoctor build tools
description: Install pinned pnpm and project dependencies with the lockfile
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        version: 11.20.0
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '24'
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      shell: bash
    - run: rustup override set 1.99.1
      shell: bash
